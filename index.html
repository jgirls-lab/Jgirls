<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Ultimate Luxury Masonry Gallery</title>

<style>
body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  display: flex;
  background: #0a0a0a; /* 深い漆黒の闇 */
  color: #e0e0e0;
  overflow: hidden;
}

/* ==========================================
   左サイドバー
   ========================================== */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #111111;
  border-right: 1px solid #222;
  padding: 25px 20px;
  box-sizing: border-box;
  flex-shrink: 0;
  z-index: 1000;
}

.logo {
  font-weight: 900;
  font-size: 24px;
  color: #ff2a6d; /* サイバーネオンピンク */
  text-shadow: 0 0 10px rgba(255, 42, 109, 0.3);
  margin-bottom: 35px;
  letter-spacing: 2px;
}

.tabs button {
  width: 100%;
  margin-bottom: 15px;
  padding: 14px;
  border: none;
  background: #1a1a1a;
  color: #888;
  cursor: pointer;
  border-radius: 12px;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.3s ease;
}

.tabs button:hover {
  background: #252525;
  color: #fff;
}

.tabs .active {
  background: #ff2a6d;
  color: white;
  box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
}

/* ==========================================
   メインコンテンツエリア
   ========================================== */
.main {
  flex: 1;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

#gallery-tab-content {
  width: 100%;
  height: 100%;
  position: relative;
}

/* 🎬 演出レイヤーA：黒フェードを極限まで濃くして透けをミリ単位に抑えたタグ画面 */
.welcome-tag-layer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(to bottom, 
    #0a0a0a 0%, 
    #0a0a0a 75%, 
    rgba(10, 10, 10, 0.99) 88%, 
    rgba(10, 10, 10, 0.75) 94%, 
    rgba(10, 10, 10, 0) 100%
  );
  z-index: 30;
  pointer-events: auto;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
  will-change: transform, opacity;
}

/* 3スクロール完了時に、上へシュパッと消え去る！ */
.welcome-tag-layer.scrolled-up {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}

.welcome-title {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: #ff2a6d;
  margin-bottom: 30px;
}

.welcome-tags-box {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 600px;
  justify-content: center;
  padding: 20px;
}

.scroll-hint {
  margin-top: 40px;
  font-size: 11px;
  color: #444;
  letter-spacing: 2px;
  animation: bounce 1.5s infinite;
  cursor: pointer;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(10px); color: #ff2a6d; }
}

/* 🎬 演出レイヤーB：最初の下がってくる位置をさらに微調整したギャラリー */
.dynamic-gallery-layer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  background: #0a0a0a;
  z-index: 20;
  transform: translateY(68%); 
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
  display: flex;
  flex-direction: column;
}

/* 3スクロール完了時に、画面の一番上（Y軸0）まで満ち上がる！ */
.dynamic-gallery-layer.pushed-up {
  transform: translateY(0);
}

/* 固定タグヘッダー */
.sticky-tag-header {
  width: 100%;
  padding: 15px 20px;
  background: #111;
  border-bottom: 1px solid #222;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 15px;
  overflow-x: auto;
  white-space: nowrap;
}
.sticky-tag-header::-webkit-scrollbar { display: none; }

.sticky-label {
  font-size: 11px;
  font-weight: bold;
  color: #ff2a6d;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ギャラリー内のスクロールエリア */
.gallery-scroll-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 15px 15px 5px 15px;
}

/* Masonryグリッド */
.grid {
  column-count: 5;
  column-gap: 12px;
}
@media (max-width: 1400px) { .grid { column-count: 4; } }
@media (max-width: 1000px) { .grid { column-count: 3; } }

.item {
  break-inside: avoid;
  margin-bottom: 12px;
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 1px solid #1a1a1a;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.item img {
  width: 100%;
  display: block;
}
.item:hover {
  border-color: #ff2a6d;
  box-shadow: 0 10px 25px rgba(255, 42, 109, 0.2);
}

/* ==========================================
   📟 超軽量ページネーションバー
   ========================================== */
.pagination-container {
  width: 100%;
  padding: 20px;
  background: #0d0d0d;
  border-top: 1px solid #1a1a1a;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  z-index: 25;
}

.page-btn {
  padding: 8px 16px;
  background: #161616;
  color: #888;
  border: 1px solid #252525;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.page-btn:hover:not(:disabled) {
  background: #222;
  color: #fff;
  border-color: #444;
}

.page-btn.active {
  background: #ff2a6d;
  color: #fff;
  border-color: #ff2a6d;
  box-shadow: 0 0 12px rgba(255, 42, 109, 0.4);
}

.page-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* ==========================================
   ✨ 左側ダイナミック拡大表示レイヤー＆左右ボタン
   ========================================== */
.big-preview-overlay {
  position: absolute;
  top: 60px;
  left: 0;
  width: calc(100% - 380px);
  height: calc(100% - 60px);
  background: rgba(5, 5, 5, 0.96);
  z-index: 40;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s linear;
  padding: 40px;
  box-sizing: border-box;
}
.big-preview-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.big-preview-img {
  max-width: 85%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
  z-index: 41;
}

.nav-flip-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(20, 20, 20, 0.6);
  color: #888;
  border: 1px solid #333;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 45;
  transition: all 0.2s ease;
  user-select: none;
}
.nav-flip-btn:hover {
  color: #fff;
  background: #ff2a6d;
  border-color: #ff2a6d;
  box-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
}
.nav-prev { left: 25px; }
.nav-next { right: 25px; }

/* ==========================================
   ⚠️ 【超極悪・新機能】エロサイト風・嫌がらせマウス追尾広告
   ========================================== */
.fake-ero-ad {
  position: absolute;
  width: 250px;
  background: #fff;
  color: #000;
  border: 3px solid #ff0055;
  border-radius: 6px;
  box-shadow: 0 10px 40px rgba(255,0,85,0.6);
  z-index: 9999; /* 全てを支配する最前面 */
  font-family: 'MS PGothic', sans-serif;
  font-size: 12px;
  padding: 10px;
  box-sizing: border-box;
  display: none; /* 最初は隠しておくよぅ */
  pointer-events: auto;
  /* ぬるぬる遅れて追尾してくるエロい挙動のコアCSS！ */
  transition: left 0.4s cubic-bezier(0.1, 0.8, 0.3, 1), top 0.4s cubic-bezier(0.1, 0.8, 0.3, 1);
}

/* 広告内の×ボタン（小さくて押しづらい仕様！） */
.fake-ad-close {
  position: absolute;
  top: -2px;
  right: -2px;
  background: #ff0055;
  color: white;
  border: 1px solid #fff;
  font-size: 10px;
  width: 16px;
  height: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.fake-ad-text {
  font-weight: bold;
  color: #d30000;
  text-align: center;
  line-height: 1.4;
  margin-bottom: 5px;
  animation: blink-ad 0.6s infinite alternate; /* チカチカ点滅ッ！ */
}
@keyframes blink-ad {
  0% { opacity: 0.2; }
  100% { opacity: 1; }
}

.fake-ad-btn {
  background: #00aa66;
  color: white;
  text-align: center;
  padding: 6px;
  border-radius: 4px;
  font-weight: bold;
  font-size: 11px;
  border-bottom: 3px solid #006633;
}

/* ==========================================
   🗂️ タグ一覧タブ画面
   ========================================== */
.tag-list-screen {
  display: none;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding: 40px;
  box-sizing: border-box;
  background: #0a0a0a;
}

.tag-screen-container {
  max-width: 900px;
  margin: 0 auto;
}

.tag-screen-search {
  margin-bottom: 40px;
}
.tag-screen-search input {
  width: 100%;
  padding: 16px 25px;
  border-radius: 30px;
  border: 2px solid #222;
  background: #111;
  color: white;
  font-size: 16px;
  box-sizing: border-box;
  outline: none;
  transition: 0.3s;
}
.tag-screen-search input:focus {
  border-color: #ff2a6d;
  box-shadow: 0 0 15px rgba(255, 42, 109, 0.2);
}

.all-tags-master-block {
  background: #111;
  padding: 30px;
  border-radius: 16px;
  border: 1px solid #1a1a1a;
}

.all-tags-title {
  font-size: 16px;
  font-weight: bold;
  color: #ff2a6d;
  margin-top: 0;
  margin-bottom: 25px;
  border-left: 3px solid #ff2a6d;
  padding-left: 10px;
  letter-spacing: 1px;
}

.tags-flex {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.tag-btn {
  padding: 10px 18px;
  background: #1a1a1a;
  color: #aaa;
  border-radius: 30px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s ease;
  border: 1px solid #222;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tag-btn:hover, .tag-btn.selected {
  background: #ff2a6d;
  color: #fff;
  border-color: #ff2a6d;
  box-shadow: 0 0 15px rgba(255, 42, 109, 0.6);
  transform: translateY(-2px);
}

.tag-count {
  font-size: 10px;
  background: #2a2a2a;
  color: #888;
  padding: 2px 6px;
  border-radius: 10px;
}
.tag-btn:hover .tag-count, .tag-btn.selected .tag-count {
  background: rgba(255,255,255,0.2);
  color: #fff;
}

/* ==========================================
   🔍 右側詳細スライドサイドバー
   ========================================== */
.detail-sidebar {
  width: 380px;
  height: 100vh;
  background: #111;
  border-left: 1px solid #222;
  position: fixed;
  top: 0;
  right: 0;
  z-index: 2000;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
  display: flex;
  flex-direction: column;
}
.detail-sidebar.open {
  transform: translateX(0);
}

.detail-content { flex: 1; overflow-y: auto; padding: 25px; box-sizing: border-box; }

.close-btn { 
  position: absolute; 
  top: 15px; 
  left: 15px; 
  background: rgba(0,0,0,0.7); 
  color: white; 
  border: none; 
  width: 35px; 
  height: 35px; 
  border-radius: 50%; 
  cursor: pointer; 
  font-size: 18px; 
  z-index: 2100; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
}
.close-btn:hover { background: #ff2a6d; }

.detail-tag-header-area {
  margin-top: 35px;
  margin-bottom: 5px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end; 
  padding-left: 45px; 
}
.detail-active-tag {
  font-size: 11px;
  background: #202020;
  color: #ff2a6d;
  border: 1px solid rgba(255, 42, 109, 0.3);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s ease;
}
.detail-active-tag:hover {
  background: #ff2a6d;
  color: #fff;
  box-shadow: 0 0 10px rgba(255, 42, 109, 0.5);
}

.detail-section-title { font-size: 12px; font-weight: bold; color: #ff2a6d; margin-bottom: 12px; letter-spacing: 1px; margin-top: 25px; }

.similar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.similar-item { aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; cursor: pointer; background: #000; }
.similar-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.2s; }
.similar-item img:hover { filter: brightness(1.2); }
</style>
</head>

<body>

<div class="fake-ero-ad" id="fake-ero-ad">
  <button class="fake-ad-close" onclick="closeFakeAd(event)">×</button>
  <div class="fake-ad-text" id="fake-ad-text-content">🔥近所の寂しい人妻があなたを待っています</div>
  <div class="fake-ad-btn">👉【今すぐ無料で会う】</div>
</div>

<div class="sidebar">
  <div class="logo">LUXE_GRID</div>
  <div class="tabs">
    <button class="active" id="btn-gallery" onclick="showTab('gallery')">ギャラリー</button>
    <button id="btn-search" onclick="showTab('search')">タグ一覧</button>
  </div>
</div>

<div class="main" id="main-content-window">

  <div id="gallery-tab-content">
    
    <div class="welcome-tag-layer" id="welcome-layer">
      <div class="welcome-title">Select Hot Tags</div>
      <div class="welcome-tags-box" id="welcome-hot-tags"></div>
      <div class="scroll-hint">▼ SCROLL DOWN TO EXPLORE ▼</div>
    </div>

    <div class="dynamic-gallery-layer" id="gallery-layer">
      <div class="sticky-tag-header">
        <div class="sticky-label">Hot:</div>
        <div class="tags-flex" id="sticky-hot-tags" style="gap:8px;"></div>
      </div>
      
      <div class="big-preview-overlay" id="big-preview-area" onclick="closeDetail()">
        <button class="nav-flip-btn nav-prev" id="btn-prev-img" onclick="navigateImage(-1, event)">◀</button>
        <img class="big-preview-img" id="big-preview-src" src="" alt="Big Preview">
        <button class="nav-flip-btn nav-next" id="btn-next-img" onclick="navigateImage(1, event)">▶</button>
      </div>
      
      <div class="gallery-scroll-wrap" id="gallery-scroll-area">
        <div class="grid" id="masonry-grid"></div>
      </div>

      <div class="pagination-container" id="pagination-bar"></div>
    </div>

  </div>

  <div class="tag-list-screen" id="tag-list-screen">
    <div class="tag-screen-container">
      <div class="tag-screen-search">
        <input type="text" id="tag-search-input" oninput="searchTagsOnScreen()" placeholder="登録されたすべてのタグから検索...">
      </div>
      
      <div class="all-tags-master-block">
        <div class="all-tags-title">🏷️ ALL TAGS INDEX</div>
        <div class="tags-flex" id="master-tag-list-container"></div>
      </div>
    </div>
  </div>

</div>

<div id="detail-sidebar" class="detail-sidebar">
  <button class="close-btn" onclick="closeDetail()">×</button>
  <div class="detail-content">
    <div class="detail-tag-header-area" id="detail-img-tags-container"></div>

    <div class="detail-section-title">🔥 RELATED ASSETS</div>
    <div id="similar-grid" class="similar-grid"></div>
  </div>
</div>


<script>
// ========================================================
// 🧠 完全自動化コアシステム＆ページネーション制御
// ========================================================
let jsonData = []; 
let filteredData = []; 
let currentImgIndex = -1; 
let wheelCount = 0; 
let isPushedUp = false; 
let currentActiveTag = null;

let currentPage = 1;
const itemsPerPage = 30; 

// ⚠️ 広告コントロール用のヤバい変数たちッ！
let mouseX = 0;
let mouseY = 0;
let adTimer = null;
const adTexts = [
  "🔥 あなたの近所に住む寂しい人妻が待っています",
  "⚠️ 警告：PCのパフォーマンスが低下しています！",
  "🔞 【即ハメ】1分で登録完了して今すぐ抜く",
  "💢 会員登録が完了しました。料金をお支払いください"
];

window.addEventListener('DOMContentLoaded', () => {
  fetch('data.json')
    .then(response => {
      if (!response.ok) throw new Error('data.jsonが読み込めないよぅ＞＜');
      return response.json();
    })
    .then(data => {
      jsonData = data; 
      filteredData = [...data]; 
      
      currentPage = 1; 
      renderGallery(); 
      initDynamicTags();
      setupScrollAnimation();
      setupMouseTracker(); // マウス追跡開始ッ！
    })
    .catch(error => {
      console.error(error);
    });
});

// ★マウスの位置を常にハッキングして記録する仕組みだよぅ！
function setupMouseTracker() {
  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    
    // 広告が表示中なら、マウスのちょっと上を追尾させるよぅ！
    const ad = document.getElementById('fake-ero-ad');
    if (ad && ad.style.display === 'block') {
      ad.style.left = (mouseX - 125) + 'px'; // 横幅250pxの半分を引いて真ん中に！
      ad.style.top = (mouseY - 90) + 'px';  // マウスの少し上に浮かせるニオイッ！
    }
  });
}

// ★【降臨システム】10秒ごとに広告を召喚する恐怖のループ！
function startAdTimer() {
  stopAdTimer(); // 重複防止
  adTimer = setTimeout(() => {
    showFakeAd();
  }, 10000); // 10000ミリ秒 ＝ 10秒だよぅッ！
}

function stopAdTimer() {
  if (adTimer) {
    clearTimeout(adTimer);
    adTimer = null;
  }
}

function showFakeAd() {
  const ad = document.getElementById('fake-ero-ad');
  const txt = document.getElementById('fake-ad-text-content');
  if (!ad) return;

  // ランダムで嫌がらせテキストを選択
  const randomText = adTexts[Math.floor(Math.random() * adTexts.length)];
  txt.textContent = randomText;

  // マウスの現在地に一瞬で配置してフワッと出す！
  ad.style.left = (mouseX - 125) + 'px';
  ad.style.top = (mouseY - 90) + 'px';
  ad.style.display = 'block';
}

function closeFakeAd(event) {
  if (event) event.stopPropagation(); // 拡大画面が閉じちゃうのを絶対ガード！
  const ad = document.getElementById('fake-ero-ad');
  if (ad) ad.style.display = 'none';
  
  // 消されても消されても、10秒後にまた復活する地獄の無限ループへ！！！♡
  startAdTimer();
}

function renderGallery() {
  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = startIndex + itemsPerPage;
  const pageItems = filteredData.slice(startIndex, endIndex);
  
  renderMasonry(pageItems, startIndex); 
  renderPaginationBar(); 
}

function renderMasonry(pageItems, globalStartIndex) {
  const grid = document.getElementById('masonry-grid');
  grid.innerHTML = '';
  
  if(!pageItems || pageItems.length === 0) {
    grid.innerHTML = '<div style="padding:20px; color:#888;">このページには画像がありません</div>';
    return;
  }
  
  pageItems.forEach((item, index) => {
    const globalIndex = globalStartIndex + index; 
    const div = document.createElement('div');
    div.className = 'item';
    div.addEventListener('click', () => openDetail(item, globalIndex)); 
    div.innerHTML = `<img src="${item.img}" alt="${item.title}">`;
    grid.appendChild(div);
  });
}

function renderPaginationBar() {
  const bar = document.getElementById('pagination-bar');
  bar.innerHTML = '';

  const totalPages = Math.ceil(filteredData.length / itemsPerPage);
  if (totalPages <= 1) {
    bar.style.display = 'none'; 
    return;
  }
  bar.style.display = 'flex';

  const prevBtn = document.createElement('button');
  prevBtn.className = 'page-btn';
  prevBtn.textContent = '◀ 前へ';
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener('click', () => changePage(currentPage - 1));
  bar.appendChild(prevBtn);

  for (let i = 1; i <= totalPages; i++) {
    const pageBtn = document.createElement('button');
    pageBtn.className = 'page-btn';
    if (i === currentPage) pageBtn.classList.add('active');
    pageBtn.textContent = i;
    pageBtn.addEventListener('click', () => changePage(i));
    bar.appendChild(pageBtn);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'page-btn';
  nextBtn.textContent = '次へ ▶';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener('click', () => changePage(currentPage + 1));
  bar.appendChild(nextBtn);
}

function changePage(pageNumber) {
  currentPage = pageNumber;
  renderGallery();
  document.getElementById('gallery-scroll-area').scrollTop = 0;
}

function initDynamicTags() {
  const tagCounts = {};
  jsonData.forEach(item => {
    if (item.tags && Array.isArray(item.tags)) {
      item.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    }
  });

  const sortedTags = Object.keys(tagCounts).sort((a,b) => tagCounts[b] - tagCounts[a]).slice(0, 10);
  const welcomeBox = document.getElementById('welcome-hot-tags');
  const stickyBox = document.getElementById('sticky-hot-tags');
  const masterBox = document.getElementById('master-tag-list-container');
  
  welcomeBox.innerHTML = ''; stickyBox.innerHTML = ''; masterBox.innerHTML = '';

  sortedTags.forEach(tag => {
    welcomeBox.appendChild(createTagButton(tag, tagCounts[tag]));
    stickyBox.appendChild(createTagButton(tag, tagCounts[tag]));
  });
  Object.keys(tagCounts).sort().forEach(tag => {
    masterBox.appendChild(createTagButton(tag, tagCounts[tag]));
  });
}

function createTagButton(tag, count) {
  const div = document.createElement('div');
  div.className = 'tag-btn';
  div.innerHTML = `${tag} <span class="tag-count">${count}</span>`;
  div.addEventListener('click', () => toggleTagFilter(tag));
  return div;
}

function toggleTagFilter(tag) {
  document.querySelectorAll('.tag-btn').forEach(btn => {
    if(btn.childNodes[0].textContent.trim() === tag) {
      btn.classList.add('selected');
    } else {
      btn.classList.remove('selected');
    }
  });

  currentActiveTag = tag;
  filteredData = jsonData.filter(item => item.tags && item.tags.includes(tag));
  
  currentPage = 1; 
  renderGallery();
  showTab('gallery');
  executePushUp();
}

function executePushUp() {
  document.getElementById('welcome-layer').classList.add('scrolled-up');
  document.getElementById('gallery-layer').classList.add('pushed-up');
  isPushedUp = true;
  wheelCount = 3;
}

function executePullDown() {
  document.getElementById('welcome-layer').classList.remove('scrolled-up');
  document.getElementById('gallery-layer').classList.remove('pushed-up');
  isPushedUp = false;
  wheelCount = 0;
}

function setupScrollAnimation() {
  const mainWindow = document.getElementById('main-content-window');
  const galleryScroll = document.getElementById('gallery-scroll-area');

  mainWindow.addEventListener('wheel', (e) => {
    if (document.getElementById('gallery-tab-content').style.display === 'none') return;

    if (!isPushedUp) {
      if (e.deltaY > 0) {
        wheelCount++;
        if (wheelCount >= 3) executePushUp();
      }
    } else {
      if (e.deltaY < 0 && galleryScroll.scrollTop === 0) {
        wheelCount--;
        if (wheelCount <= 0) executePullDown();
      }
    }
  }, { passive: true });

  document.querySelector('.scroll-hint').addEventListener('click', executePushUp);
}

function searchTagsOnScreen() {
  const query = document.getElementById('tag-search-input').value.toLowerCase();
  document.querySelectorAll('#master-tag-list-container .tag-btn').forEach(btn => {
    const txt = btn.childNodes[0].textContent.trim().toLowerCase();
    btn.style.display = txt.includes(query) ? 'flex' : 'none';
  });
}

function openDetail(item, index) {
  currentImgIndex = index;
  
  const sidebar = document.getElementById('detail-sidebar');
  const bigPreviewArea = document.getElementById('big-preview-area');
  const bigPreviewSrc = document.getElementById('big-preview-src');
  
  bigPreviewSrc.src = item.img;
  bigPreviewArea.classList.add('open'); 

  // ★画像を拡大したから、カウントダウン開始ッ！10秒後にあいつが来るよぅ！
  startAdTimer();

  const tagsContainer = document.getElementById('detail-img-tags-container');
  tagsContainer.innerHTML = '';
  if (item.tags && Array.isArray(item.tags)) {
    item.tags.forEach(tag => {
      const tagSpan = document.createElement('span');
      tagSpan.className = 'detail-active-tag';
      tagSpan.textContent = `#${tag}`;
      tagSpan.addEventListener('click', (e) => {
        e.stopPropagation();
        closeDetail();
        toggleTagFilter(tag);
      });
      tagsContainer.appendChild(tagSpan);
    });
  }

  const similarGrid = document.getElementById('similar-grid');
  similarGrid.innerHTML = '';
  
  const similars = jsonData.filter(all => all.img !== item.img && all.tags.some(t => item.tags.includes(t)));
  
  similars.slice(0, 15).forEach(sim => {
    const div = document.createElement('div');
    div.className = 'similar-item';
    div.innerHTML = `<img src="${sim.img}">`;
    div.addEventListener('click', (e) => {
      e.stopPropagation(); 
      openDetail(sim, -1); 
    });
    similarGrid.appendChild(div);
  });

  sidebar.classList.add('open'); 
}

function navigateImage(direction, event) {
  event.stopPropagation(); 
  
  if (currentImgIndex === -1 || filteredData.length === 0) return;

  let nextIndex = currentImgIndex + direction;
  if (nextIndex >= filteredData.length) nextIndex = 0;
  if (nextIndex < 0) nextIndex = filteredData.length - 1;

  const targetPage = Math.floor(nextIndex / itemsPerPage) + 1;
  if (targetPage !== currentPage) {
    currentPage = targetPage;
    renderGallery();
  }

  openDetail(filteredData[nextIndex], nextIndex);
}

function closeDetail() { 
  const sidebar = document.getElementById('detail-sidebar');
  const bigPreviewArea = document.getElementById('big-preview-area');
  if (sidebar) sidebar.classList.remove('open');
  if (bigPreviewArea) bigPreviewArea.classList.remove('open'); 
  currentImgIndex = -1;

  // ★詳細を閉じたら、広告も消してタイマーも完全ストップさせる優しさッ！
  stopAdTimer();
  const ad = document.getElementById('fake-ero-ad');
  if (ad) ad.style.display = 'none';
}

function showTab(type) {
  const btnG = document.getElementById('btn-gallery');
  const btnS = document.getElementById('btn-search');
  const gTab = document.getElementById('gallery-tab-content');
  const sTab = document.getElementById('tag-list-screen');

  if (type === 'gallery') {
    btnG.classList.add('active'); btnS.classList.remove('active');
    gTab.style.display = 'block'; sTab.style.display = 'none';
  } else {
    btnG.classList.remove('active'); btnS.classList.add('active');
    gTab.style.display = 'none'; sTab.style.display = 'block';
    closeDetail();
  }
}
</script>
